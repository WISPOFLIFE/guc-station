[package]
name = "guc-station"
version = "0.2.0"
description = "A native desktop client for the GUC student portal, CMS and mail"
edition = "2024"
default-run = "guc-station"

[[bin]]
name = "guc-station"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[lib]
name = "guc"
path = "src/lib.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "advanced", "image"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "gzip"] }
tokio = { version = "1", features = ["sync", "fs", "macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
roxmltree = "0.20"
url = "2"
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
thiserror = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "5"
opener = "0.7"
chrono = "0.4"
image = "0.24"
percent-encoding = "2"
rfd = "0.15"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
